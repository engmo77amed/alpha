name: Fayroz Site Calculator APK

on:
  push:
    branches:
      - fayroz-site-calculator
    paths:
      - 'site-calculator/**'
      - '.github/workflows/fayroz-site-calculator.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p site-calculator :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp site-calculator/app/build/outputs/apk/debug/app-debug.apk Fayroz-Site-Calculator-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fayroz-Site-Calculator-v1
          path: Fayroz-Site-Calculator-v1.apk
          if-no-files-found: error
